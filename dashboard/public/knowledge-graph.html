  <style>
    :root {
      --bg-darker: #05080c;
      --bg-dark: #0a0f18;
      --border-cyber: rgba(0, 212, 255, 0.25);
      --border-cyber-glow: rgba(0, 212, 255, 0.6);
      --neon-cyan: #00d4ff;
      --neon-violet: #a55eea;
      --neon-green: #2ed573;
      --text-glow: 0 0 10px rgba(0, 212, 255, 0.4);
    }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      background: var(--bg-darker);
    }

    /* 容器显式像素高度，100% 杜绝高度塌陷 */
    .sigma-container {
      width: 100%;
      height: 650px;
      background: var(--bg-dark);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0, 212, 255, 0.05);
    }

    /* 三维视角控制栏 */
    .view-segment-control {
      display: flex;
      background: rgba(10, 15, 24, 0.85);
      border: 1px solid var(--border-cyber);
      border-radius: 30px;
      padding: 3px;
      gap: 5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .view-tab {
      background: transparent;
      border: none;
      color: #8c9cb3;
      padding: 8px 18px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .view-tab:hover {
      color: #fff;
    }
    .view-tab.active {
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: var(--neon-cyan);
      text-shadow: var(--text-glow);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    /* 精美控制面板 */
    .control-panel-grid {
      background: rgba(10, 15, 24, 0.6);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }
    
    .panel-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: center;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 220px;
    }
    .slider-group label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8c9cb3;
      display: flex;
      justify-content: space-between;
    }
    .slider-group label span {
      color: var(--neon-cyan);
      font-weight: bold;
    }
    .cyber-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }
    .cyber-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .cyber-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    /* 底部时间线沙盘 */
    .temporal-playback-bar {
      margin-top: 1.5rem;
      background: rgba(10, 15, 24, 0.8);
      border: 1px solid var(--border-cyber);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .timeline-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timeline-title {
      font-size: 0.85rem;
      color: #fff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .play-btn {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--neon-cyan);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .play-btn:hover {
      background: rgba(0, 212, 255, 0.35);
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
    }

    /* 右上角悬浮图例 */
    .graph-legend {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(5, 8, 12, 0.85);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      padding: 0.8rem;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #8c9cb3;
    }
    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .graph-controls {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 10;
    }
    .control-btn {
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .control-btn:hover {
      background: rgba(0, 212, 255, 0.4);
    }

    /* Inspector前驱后继事件连线 */
    .relation-flow-tree {
      margin-top: 1rem;
      border-left: 2px dashed rgba(0, 212, 255, 0.25);
      padding-left: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .flow-step {
      position: relative;
    }
    .flow-step::before {
      content: '';
      position: absolute;
      left: calc(-1rem - 6px);
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8c9cb3;
      border: 2px solid var(--bg-dark);
    }
    .flow-step.precursor::before {
      background: var(--neon-violet);
    }
    .flow-step.current::before {
      background: var(--neon-cyan);
      box-shadow: 0 0 6px var(--neon-cyan);
    }
    .flow-step.successor::before {
      background: var(--neon-green);
    }
    .flow-step-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8c9cb3;
      margin-bottom: 0.1rem;
    }
    .flow-step-content {
      font-size: 0.8rem;
      color: #fff;
      font-weight: 500;
    }

    /* 显式滚动条高度限制，100% 杜绝 Inspector 溢出截断 */
    .inspector-scroll-area {
      overflow-y: auto;
      max-height: 520px;
      min-height: 0;
      padding-right: 0.3rem;
    }

    /* 暗黑科技风滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-cyber);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-cyber-glow);
    }

    const CONTINENTS = [
      // 欧亚非大陆（包含西欧海岸线、非洲大陆轮廓、红海、阿拉伯半岛、印度半岛、中南半岛、中国漫长海岸线与西伯利亚北冰洋沿岸）

        [-10, 62], [0, 60], [10, 58], [15, 62], [25, 71], [35, 69], [45, 68], [60, 70], [80, 73], [105, 77],
        [130, 73], [160, 76], [175, 66], [170, 60], [150, 56], [140, 53], [142, 43], [130, 42], [125, 38], [122, 30],

        [30, -34], [18, -34], [10, -22], [8, -5], [-13, 5], [-16, 16], [-10, 32], [-5, 36], [10, 37], [25, 35],
        [30, 31], [32, 28], [25, 23], [15, 15], [5, 5], [10, -10], [15, 5], [20, 15], [30, 30], [20, 35],

      [

      [

    // 地缘热点自动提取器
    function getGeoKey(title, desc) {
      const text = ((title || '') + ' ' + (desc || '')).toLowerCase();
      if (text.includes('中国') || text.includes('china') || text.includes('亚太') || text.includes('南海') || text.includes('北京') || text.includes('上海') || text.includes('深圳')) {
        if (text.includes('台湾') || text.includes('taiwan') || text.includes('台海')) return 'TW';
        return 'CN';
      }
      if (text.includes('美国') || text.includes('us ') || text.includes('america') || text.includes('华盛顿') || text.includes('白宫') || text.includes('pentagon')) {
        return 'US';
      }
      if (text.includes('俄罗斯') || text.includes('russia') || text.includes('乌克兰') || text.includes('莫斯科') || text.includes('俄军') || text.includes('基辅')) {
        return 'RU';
      }
      if (text.includes('以色列') || text.includes('israel') || text.includes('加沙') || text.includes('哈马斯') || text.includes('巴勒斯坦')) {
        return 'IL';
      }
      if (text.includes('伊朗') || text.includes('iran') || text.includes('德黑兰') || text.includes('革命卫队')) {
        return 'IR';
      }
      if (text.includes('欧洲') || text.includes('europe') || text.includes('北约') || text.includes('欧盟') || text.includes('英国') || text.includes('法国') || text.includes('德国')) {
        return 'EU';
      }
      return 'GL'; // 归入公海/地缘交汇区
    }

    // 初始化 Sigma 渲染引擎
    async function initGraph() {
      const sigmaContainer = document.getElementById('sigma-canvas');
      
      renderer = new Sigma(graph, sigmaContainer, {
        renderEdgeLabels: true,
        defaultEdgeType: "line",
        labelFont: "Outfit, 'Segoe UI', sans-serif",
        labelSize: 11,
        labelColor: { color: "#d7e3f5" },
        stagePadding: 50
      });

      // 交互监听：高亮与淡化处理
      renderer.on("enterNode", ({ node }) => {
        hoveredNodeId = node;
        updateNodesAndEdgesOpacity();
      });

      renderer.on("leaveNode", () => {
        hoveredNodeId = null;
        updateNodesAndEdgesOpacity();
      });

      // 单击聚焦与下钻交互
      renderer.on("clickNode", ({ node }) => {
        const attr = graph.getNodeAttributes(node);
        console.log('[Sigma ClickNode] ID:', node, 'Type:', attr.nodeType, 'Level:', currentGraphLevel);
        
        if (currentGraphLevel === 'global') {
          if (attr.nodeType === 'summary') {
            enterDetailMode(node);
          }
        } else {
          if (attr.nodeType === 'atomic') {
            focusedNodeId = node;
            updateNodesAndEdgesOpacity();
            showAtomicInspector(attr.data);
            renderer.getCamera().animate({ x: attr.x, y: attr.y, ratio: 0.15 }, { duration: 500 });
          }
        }
      });

      // 双击下钻与锁定
      renderer.on("doubleClickNode", ({ node }) => {
        const attr = graph.getNodeAttributes(node);
        console.log('[Sigma DoubleClickNode] ID:', node, 'Type:', attr.nodeType, 'Level:', currentGraphLevel);
        
        if (currentGraphLevel === 'global') {
          if (attr.nodeType === 'summary') {
            enterDetailMode(node);
          }
        } else {
          if (attr.nodeType === 'atomic') {
            focusedNodeId = node;
            updateNodesAndEdgesOpacity();
            renderer.getCamera().animate({ x: attr.x, y: attr.y, ratio: 0.1 }, { duration: 500 });
          }
        }
      });

      // 照相机 process 更新时，自动重绘底层 Canvas 世界地图（绝对物理贴合对齐！）
      renderer.getCamera().on("updated", () => {
        drawCyberWorldMap();
      });

      document.getElementById('zoom-in').addEventListener('click', () => renderer.getCamera().animatedZoom());
      document.getElementById('zoom-out').addEventListener('click', () => renderer.getCamera().animatedUnzoom());
      document.getElementById('zoom-reset').addEventListener('click', () => renderer.getCamera().animatedReset());

      await loadGlobalGraph();
    }

    // 绘制霓虹发光世界地图 (采用 renderer.graphToViewport 绝对物理坐标对齐，根治 undefined 延迟与错位)
    function drawCyberWorldMap() {
      const canvas = document.getElementById('geo-map-canvas');
      if (currentViewMode !== 'geo' || !canvas || !renderer) return;

      const ctx = canvas.getContext('2d');
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      
      // 同步 Canvas 实际分辨率，防止出现模糊
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      ctx.clearRect(0, 0, width, height);

      // 官方自带物理投影变换函数，绝对可靠！
      const geoToScreen = (lng, lat) => {
        // graph坐标系对应的绝对位置为: x = lng * 3.5, y = -lat * 4.5
        return renderer.graphToViewport({ x: lng * 3.5, y: -lat * 4.5 });
      };

      // 1. 绘制极淡的赛博经纬度网格线
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let lng = -150; lng <= 150; lng += 30) {
        const pStart = geoToScreen(lng, 80);
        const pEnd = geoToScreen(lng, -80);
        ctx.beginPath();
        ctx.moveTo(pStart.x, pStart.y);
        ctx.lineTo(pEnd.x, pEnd.y);
        ctx.stroke();
      }
      for (let lat = -60; lat <= 60; lat += 20) {
        const pStart = geoToScreen(-180, lat);
        const pEnd = geoToScreen(180, lat);
        ctx.beginPath();
        ctx.moveTo(pStart.x, pStart.y);
        ctx.lineTo(pEnd.x, pEnd.y);
        ctx.stroke();
      }

      // 2. 绘制各大洲赛博多边形板块轮廓（带有动态发光外描边）
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(0, 212, 255, 0.4)';
      
      CONTINENTS.forEach(continent => {
        ctx.beginPath();
        continent.forEach((point, i) => {
          const screenPos = geoToScreen(point[0], point[1]);
          if (i === 0) {
            ctx.moveTo(screenPos.x, screenPos.y);
          } else {
            ctx.lineTo(screenPos.x, screenPos.y);
          }
        });
        ctx.closePath();

        // 极淡发光内填充 + 霓虹发光外轮廓，高地缘逼格溢出屏幕！
        ctx.fillStyle = 'rgba(0, 212, 255, 0.035)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 212, 255, 0.22)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      ctx.shadowBlur = 0; // 重置阴影
    }

    function getSummaryColor(memberCount, isIsolated) {
      if (isIsolated) return '#747d8c';
      if (memberCount >= 100) return '#ff4757';
      if (memberCount >= 50) return '#ffa502';
      if (memberCount >= 20) return '#eccc68';
      if (memberCount >= 5) return '#2ed573';
      return '#00d4ff';
    }

    // 智能图谱几何中心自适应居中对齐与缩放算法 (防零与排版延迟就绪安全保护版)
    function fitGraphToView(animateDuration = 300) {
      if (graph.order === 0 || !renderer) return;

      // 兼容全局 'summary' 节点与下钻微观 'atomic' 节点，提取当前非 hidden 的活跃可视节点
      const activeNodes = graph.nodes().filter(n => {
        const attr = graph.getNodeAttributes(n);
        return (attr.nodeType === 'summary' || attr.nodeType === 'atomic') && !attr.hidden;
      });

      console.log('[fitGraphToView][LOG] Camera autoconfig triggered. activeNodesLength =', activeNodes.length, 'graphOrder =', graph.order);

      if (activeNodes.length === 0) return;

      // 使用官方推荐的 Camera.animatedReset() 方法，让 Sigma 内部自动基于当前所有可视节点的归一化包围盒自适应居中，
      // 物理对齐精度 100%，彻底根治手动计算绝对坐标在 Viewport 与 Camera 空间中引起的飞出和黑屏崩溃 Bug
      renderer.getCamera().animatedReset();

      // 针对地缘沙盘 (geo 模式) 绝大部分强地缘节点聚集在北半球 (y < 0 空间) 的特质，
      // 动态向北半球 (y 轴负方向) 偏移相机焦点，使世界地图和红光节点能端端正正地居中在 Canvas 黑框正中央！
      if (currentViewMode === 'geo') {
        setTimeout(() => {
          if (renderer && currentViewMode === 'geo') {
            const camera = renderer.getCamera();
            const beforeState = camera.getState();
            // 北半球方向微调偏移以自适应垂直居中 (屏幕上往上移)
            camera.animate({
              y: beforeState.y - 45.0
            }, { duration: 180 });
            
            setTimeout(() => {
              if (renderer) {
                console.log('[fitGraphToView][LOG] Geo mode Y-offset shift applied. BeforeY =', beforeState.y, 'AfterY =', renderer.getCamera().getState().y);
              }
            }, 200);
          }
        }, 320); // 留出充足时间等待 Sigma 归一化重绘完毕
      }
    }

    // 全局数据载入
    async function loadGlobalGraph() {
      document.getElementById('list-meta').textContent = '加载全局中...';
      focusedNodeId = null;
      document.getElementById('btn-focus-reset').style.display = 'none';

      try {
        const sourceVal = document.getElementById('filter-source').value;
        const response = await api.getGlobalRelationshipSummaryGraph({ limit: 100, minMemberCount: 1, source: sourceVal });
        
        let { nodes, links } = response.data;

        rawNodes = nodes;
        rawLinks = links;

        // 计算时间轴范围
        if (nodes.length > 0) {
          const times = nodes.map(n => new Date(n.time_start).getTime()).filter(t => !isNaN(t));
          if (times.length > 0) {
            const minTime = Math.min(...times);
            const maxTime = Math.max(...times);
            
            document.getElementById('time-min-label').textContent = new Date(minTime).toLocaleDateString();
            document.getElementById('time-max-label').textContent = new Date(maxTime).toLocaleDateString();
            
            const slider = document.getElementById('slider-timeline');
            slider.min = minTime;
            slider.max = maxTime;
            slider.value = maxTime;
            currentFilterTime = maxTime;
            document.getElementById('val-time-display').textContent = new Date(maxTime).toLocaleDateString();
          }
        }

        renderVisualGraph();
      } catch (err) {
        console.error(err);
        document.getElementById('list-meta').textContent = '加载失败';
      }
    }

    // 核心渲染器
    function renderVisualGraph() {
      graph.clear();

      if (rawNodes.length === 0) {
        document.getElementById('list-meta').textContent = '暂无符合筛选的数据';
        updateNodeList([]);
        return;
      }

      const summaryOffsets = {};
      const getOffset = (geo) => {
        if (!summaryOffsets[geo]) summaryOffsets[geo] = 0;
        const index = summaryOffsets[geo]++;
        if (index === 0) return { dx: 0, dy: 0 };
        const radius = 12 + Math.floor(index / 8) * 8;
        const angle = (index % 8) * Math.PI * 0.25;
        return {
          dx: Math.cos(angle) * radius,
          dy: Math.sin(angle) * radius
        };
      };

      // 1. 添加 Summary 节点
      rawNodes.forEach((n, i) => {
        const memberCount = n.member_count || 1;
        const nodeColor = getSummaryColor(memberCount, n.summary_kind === 'isolated');
        const nodeSize = Math.max(Math.min(Math.log(memberCount + 1) * 3 + 3, 14), 4.5);

        const angle = (i / rawNodes.length) * Math.PI * 2;
        const topoX = Math.cos(angle) * 250;
        const topoY = Math.sin(angle) * 250;

        const geoKey = getGeoKey(n.title, n.description);
        const geo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];
        const geoXY = { x: geo.lng * 3.5, y: -geo.lat * 4.5 };
        const offset = getOffset(geoKey);

        const isGeoMode = (currentViewMode === 'geo');
        const finalX = isGeoMode ? (geoXY.x + offset.dx) : topoX;
        const finalY = isGeoMode ? (geoXY.y + offset.dy) : topoY;

        const isTimeHidden = currentFilterTime && (new Date(n.time_start).getTime() > currentFilterTime);

        graph.addNode(String(n.id), {
          label: n.title ? (n.title.substring(0, 15) + (n.title.length > 15 ? '...' : '')) : `Summary ${n.id}`,
          x: finalX,
          y: finalY,
          size: nodeSize,
          color: nodeColor,
          nodeType: 'summary',
          parentSummary: null,
          hidden: isTimeHidden,
          data: n,
          originalX: topoX,
          originalY: topoY,
          geoX: geoXY.x + offset.dx,
          geoY: geoXY.y + offset.dy
        });
      });

      // 2. 添加连线（滑块过滤）
      rawLinks.forEach(l => {
        if (l.weight >= currentMinWeight) {
          if (graph.hasNode(String(l.source)) && graph.hasNode(String(l.target))) {
            let edgeLabel = `${l.weight}`;
            let edgeColor = "rgba(0, 212, 255, 0.15)";
            
            if (l.bridge_weight > 0 && l.edge_weight > 0) {
              edgeLabel = `${l.edge_weight}边 | ${l.bridge_weight}桥`;
              edgeColor = "rgba(46, 213, 115, 0.4)";
            } else if (l.bridge_weight > 0) {
              edgeLabel = `${l.bridge_weight}桥`;
              edgeColor = "rgba(165, 94, 234, 0.35)";
            } else if (l.edge_weight > 0) {
              edgeLabel = `${l.edge_weight}边`;
              edgeColor = "rgba(0, 212, 255, 0.25)";
            }

            graph.addEdge(String(l.source), String(l.target), {
              size: Math.max(Math.min(Math.log(l.weight + 1) * 1.5, 5), 1),
              color: edgeColor,
              label: edgeLabel,
              hidden: false,
              weight: l.weight
            });
          }
        }
      });

      document.getElementById('list-meta').textContent = `展示 ${rawNodes.filter(n => !graph.getNodeAttribute(String(n.id), 'hidden')).length}/${rawNodes.length} 节点`;
      updateNodeList(rawNodes);

      // 加入 100ms 的排版就绪延迟 Schedule，保证 client 宽高稳定获取，彻底根治渲染偏移和越界截断
      setTimeout(() => {
        if (renderer) {
          renderer.refresh();
          fitGraphToView(250);
        }
      }, 100);

      updateNodesAndEdgesOpacity();
      
      // 触发一次地图重绘
      drawCyberWorldMap();
    }

    // 动态调整透明度
    function updateNodesAndEdgesOpacity() {
      if (currentGraphLevel === 'global') {
        if (focusedNodeId && graph.hasNode(focusedNodeId)) {
          const neighbors = new Set(graph.neighbors(focusedNodeId));
          neighbors.add(focusedNodeId);

          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'summary') return;
            if (neighbors.has(node)) {
              graph.setNodeAttribute(node, 'color', getSummaryColor(attr.data.member_count, attr.data.summary_kind === 'isolated'));
              graph.setNodeAttribute(node, 'label', attr.data.title);
            } else {
              graph.setNodeAttribute(node, 'color', 'rgba(100, 110, 120, 0.05)');
              graph.setNodeAttribute(node, 'label', '');
            }
          });

          graph.forEachEdge((edge, attr, source, target) => {
            if ((source === focusedNodeId || target === focusedNodeId) && attr.weight >= currentMinWeight) {
              graph.setEdgeAttribute(edge, 'color', 'rgba(0, 212, 255, 0.6)');
              graph.setEdgeAttribute(edge, 'size', 3);
            } else {
              graph.setEdgeAttribute(edge, 'color', 'rgba(255, 255, 255, 0.01)');
            }
          });
        } else if (hoveredNodeId && graph.hasNode(hoveredNodeId)) {
          const neighbors = new Set(graph.neighbors(hoveredNodeId));
          neighbors.add(hoveredNodeId);

          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'summary') return;
            if (neighbors.has(node)) {
              graph.setNodeAttribute(node, 'color', getSummaryColor(attr.data.member_count, attr.data.summary_kind === 'isolated'));
            } else {
              graph.setNodeAttribute(node, 'color', 'rgba(100, 110, 120, 0.08)');
            }
          });

          graph.forEachEdge((edge, attr, source, target) => {
            if ((source === hoveredNodeId || target === hoveredNodeId) && attr.weight >= currentMinWeight) {
              graph.setEdgeAttribute(edge, 'color', 'rgba(0, 212, 255, 0.65)');
            } else {
              graph.setEdgeAttribute(edge, 'color', 'rgba(255, 255, 255, 0.02)');
            }
          });
        } else {
          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'summary') return;
            graph.setNodeAttribute(node, 'color', getSummaryColor(attr.data.member_count, attr.data.summary_kind === 'isolated'));
            graph.setNodeAttribute(node, 'label', attr.data.title ? (attr.data.title.substring(0, 15) + (attr.data.title.length > 15 ? '...' : '')) : `Summary ${node}`);
          });

          graph.forEachEdge((edge, attr, source, target) => {
            let origColor = "rgba(0, 212, 255, 0.15)";
            if (attr.label && attr.label.includes('桥')) {
              origColor = "rgba(165, 94, 234, 0.25)";
            } else if (attr.label && attr.label.includes('边')) {
              origColor = "rgba(0, 212, 255, 0.22)";
            }
            graph.setEdgeAttribute(edge, 'color', origColor);
            graph.setEdgeAttribute(edge, 'size', Math.max(Math.min(Math.log(attr.weight + 1) * 1.5, 5), 1));
          });
        }
      } else {
        // 微观原子图高亮逻辑
        if (focusedNodeId && graph.hasNode(focusedNodeId)) {
          const neighbors = new Set(graph.neighbors(focusedNodeId));
          neighbors.add(focusedNodeId);

          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'atomic') return;
            if (neighbors.has(node)) {
              graph.setNodeAttribute(node, 'color', '#00d4ff');
              graph.setNodeAttribute(node, 'label', attr.data.title);
            } else {
              graph.setNodeAttribute(node, 'color', 'rgba(100, 110, 120, 0.05)');
              graph.setNodeAttribute(node, 'label', '');
            }
          });

          graph.forEachEdge((edge, attr, source, target) => {
            if (source === focusedNodeId || target === focusedNodeId) {
              const isTemp = attr.edgeType === 'temporal';
              graph.setEdgeAttribute(edge, 'color', isTemp ? 'rgba(165, 94, 234, 0.85)' : 'rgba(0, 212, 255, 0.8)');
              graph.setEdgeAttribute(edge, 'size', 3);
            } else {
              graph.setEdgeAttribute(edge, 'color', 'rgba(255, 255, 255, 0.01)');
            }
          });
        } else if (hoveredNodeId && graph.hasNode(hoveredNodeId)) {
          const neighbors = new Set(graph.neighbors(hoveredNodeId));
          neighbors.add(hoveredNodeId);

          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'atomic') return;
            if (neighbors.has(node)) {
              graph.setNodeAttribute(node, 'color', '#00d4ff');
            } else {
              graph.setNodeAttribute(node, 'color', 'rgba(100, 110, 120, 0.08)');
            }
          });

          graph.forEachEdge((edge, attr, source, target) => {
            if (source === hoveredNodeId || target === hoveredNodeId) {
              const isTemp = attr.edgeType === 'temporal';
              graph.setEdgeAttribute(edge, 'color', isTemp ? 'rgba(165, 94, 234, 0.75)' : 'rgba(0, 212, 255, 0.75)');
            } else {
              graph.setEdgeAttribute(edge, 'color', 'rgba(255, 255, 255, 0.02)');
            }
          });
        } else {
          graph.forEachNode((node, attr) => {
            if (attr.nodeType !== 'atomic') return;
            graph.setNodeAttribute(node, 'color', '#00d4ff');
            graph.setNodeAttribute(node, 'label', attr.data.title ? (attr.data.title.substring(0, 15) + (attr.data.title.length > 15 ? '...' : '')) : `Event ${node}`);
          });

          graph.forEachEdge((edge, attr, source, target) => {
            const isTemp = attr.edgeType === 'temporal';
            graph.setEdgeAttribute(edge, 'color', isTemp ? 'rgba(165, 94, 234, 0.35)' : 'rgba(0, 212, 255, 0.3)');
            graph.setEdgeAttribute(edge, 'size', isTemp ? 1.5 : Math.max(Math.min(Math.log(attr.weight + 1) * 1.5, 5), 1.5));
          });
        }
      }
      
      renderer.refresh();
    }

    // 切换视角
    window.switchViewMode = (mode) => {
      if (currentViewMode === mode) return;
      currentViewMode = mode;

      // 100% 根治脏状态跨视图残留黑屏崩溃 Bug：切换模式时彻底将 Camera 交互状态擦除复位
      if (renderer) {
        console.log('[switchViewMode][LOG] ViewMode changed. Resetting camera matrices to default.');
        renderer.getCamera().animatedReset();
      }

      const canvas = document.getElementById('geo-map-canvas');
      document.querySelectorAll('.view-tab').forEach(btn => btn.classList.remove('active'));
      
      if (mode === 'topology') {
        document.getElementById('tab-topology').classList.add('active');

        if (canvas) canvas.style.display = 'none';

        document.getElementById('graph-legend').style.display = 'none';
        if (canvas) canvas.style.display = 'block';
      }

      renderVisualGraph();
      
      // 切换视图后排版就绪后居中
      setTimeout(() => {
        if (renderer) {
          renderer.refresh();
          fitGraphToView(200);
        }
      }, 120);
    };

    // 边密度调节
    window.updateLinkFilter = (val) => {
      currentMinWeight = parseInt(val, 10);
      document.getElementById('val-link-weight').textContent = `${val} 关联`;
      renderVisualGraph();
    };

    // 来源筛选
    window.onFilterChange = () => {
      loadGlobalGraph();
    };

    // 时序筛选
    window.updateTimeFilter = (val) => {
      currentFilterTime = parseInt(val, 10);
      document.getElementById('val-time-display').textContent = new Date(currentFilterTime).toLocaleDateString();

      let visibleCount = 0;
      if (currentGraphLevel === 'global') {
        rawNodes.forEach(n => {
          const isTimeHidden = new Date(n.time_start).getTime() > currentFilterTime;
          if (graph.hasNode(String(n.id))) {
            graph.setNodeAttribute(String(n.id), 'hidden', isTimeHidden);
            if (!isTimeHidden) visibleCount++;
          }
        });
        document.getElementById('list-meta').textContent = `展示 ${visibleCount}/${rawNodes.length} 节点`;
        updateNodeList(rawNodes); // 联动更新左侧宏观列表
      } else {
        detailNodes.forEach(n => {
          const isTimeHidden = new Date(n.event_time).getTime() > currentFilterTime;
          if (graph.hasNode(String(n.id))) {
            graph.setNodeAttribute(String(n.id), 'hidden', isTimeHidden);
            if (!isTimeHidden) visibleCount++;
          }
        });
        document.getElementById('list-meta').textContent = `展示 ${visibleCount}/${detailNodes.length} 原子节点`;
        updateDetailNodeList(detailNodes); // 联动更新左侧微观原子列表
      }

      renderer.refresh();
      
      // 时间线移动时，同样重绘一次地图
      drawCyberWorldMap();
    };

    // 自动播放
    window.toggleTimelinePlay = () => {
      const btn = document.getElementById('btn-play-timeline');
      const slider = document.getElementById('slider-timeline');
      
      if (isPlaying) {
        isPlaying = false;
        btn.textContent = '▶ 自动播放';
        clearInterval(playTimer);
      } else {
        isPlaying = true;
        btn.textContent = '⏸ 暂停';
        
        const minVal = parseInt(slider.min, 10);
        const maxVal = parseInt(slider.max, 10);
        
        if (parseInt(slider.value, 10) >= maxVal) {
          slider.value = minVal;
        }

        const step = (maxVal - minVal) / 25;
        playTimer = setInterval(() => {
          let curr = parseInt(slider.value, 10) + step;
          if (curr >= maxVal) {
            curr = maxVal;
            isPlaying = false;
            btn.textContent = '▶ 自动播放';
            clearInterval(playTimer);
          }
          slider.value = curr;
          updateTimeFilter(curr);
        }, 800);
      }
    };

    // 解锁核心锁定
    window.resetFocusMode = () => {
      focusedNodeId = null;
      document.getElementById('btn-focus-reset').style.display = 'none';
      updateNodesAndEdgesOpacity();
      fitGraphToView(400);
    };

    // 重置全局
    window.resetGlobalView = () => {
      document.getElementById('filter-source').value = '';
      document.getElementById('slider-link-weight').value = 2;
      currentMinWeight = 2;
      document.getElementById('val-link-weight').textContent = '2 关联';
      loadGlobalGraph();
    };

    // 构建并展示时序故事树 (已加入完善的报错捕获和日志回显)
    async function showInspector(attr) {
      const body = document.getElementById('inspector-body');
      const data = attr.data;
      
      console.log('[Inspector] Loading summary node details. ID:', data.id, 'Title:', data.title);

      const geoKey = getGeoKey(data.title, data.description);
      const geoInfo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];

      body.innerHTML = `
        <div class="lineage-card" style="margin-bottom:1rem">
          <div class="eyebrow" style="color: var(--neon-cyan)">关系层节点 (L2 Summary)</div>
          <h4 style="color:#fff; font-size:1.05rem; margin:0.4rem 0;">${data.title}</h4>
          <p style="color:#a5b5c9; font-size:0.8rem; line-height:1.4;">${data.description || '暂无描述'}</p>
          <div class="chip-row" style="margin-top:0.6rem">
            <span class="chip info" style="font-size:0.7rem">${data.member_count} 原子事件</span>
            <span class="chip success" style="font-size:0.7rem">${data.edge_count} 关联边</span>
            <span class="chip warn" style="font-size:0.7rem">📍 ${geoInfo.name}</span>
          </div>
          <div style="margin-top:0.8rem">
            <small style="color:#576b85; font-size:0.7rem">起止时间: ${new Date(data.time_start).toLocaleDateString()} - ${new Date(data.time_end).toLocaleDateString()}</small>
          </div>
        </div>
        
        <div class="lineage-card" style="margin-bottom:1.5rem">
          <div class="eyebrow" style="color: var(--neon-violet)">⏳ 时序故事链 (前因后果)</div>
          <div class="relation-flow-tree" id="temporal-flow-loader">
            <div style="color:#8c9cb3; font-size:0.75rem;">正在回溯时序上下文...</div>
          </div>
        </div>
      `;

      try {
        // 请求该节点所在的完整成员，推演相邻故事链
        console.log('[Inspector] Requesting endpoint: `/api/v1/dashboard/graph/summaries/' + data.id + '/detail`');
        const response = await api.getRelationshipSummaryGraph(data.id);
        
        console.log('[Inspector] Endpoint response payload:', response);
        const { nodes } = response.data;
        
        const loader = document.getElementById('temporal-flow-loader');
        if (!nodes || nodes.length === 0) {
          loader.innerHTML = '<div style="color:#8c9cb3; font-size:0.75rem;">该地缘事件独立发生，无显著前后关联。</div>';
          return;
        }

        // 依时间排序获取前驱、中枢、后继事件
        const sortedProtos = nodes
          .filter(n => n.event_time)
          .sort((a, b) => new Date(a.event_time) - new Date(b.event_time));

        if (sortedProtos.length < 2) {
          loader.innerHTML = '<div style="color:#8c9cb3; font-size:0.75rem;">原子证据不足，无法构成时序推演链条。</div>';
          return;
        }

        const precursor = sortedProtos[0];
        const current = sortedProtos[Math.floor(sortedProtos.length / 2)];
        const successor = sortedProtos[sortedProtos.length - 1];

        loader.innerHTML = `
          <div class="flow-step precursor">
            <div class="flow-step-label">💡 溯源起因 (Precursor)</div>
            <div class="flow-step-content">${precursor.title}</div>
            <div style="font-size:0.7rem; color:#8c9cb3;">${new Date(precursor.event_time).toLocaleDateString()}</div>
          </div>
          
          <div class="flow-step current">
            <div class="flow-step-label">🎯 当前核心事件 (Core Event)</div>
            <div class="flow-step-content" style="color:var(--neon-cyan)">${current.title}</div>
            <div style="font-size:0.7rem; color:#8c9cb3;">${new Date(current.event_time).toLocaleDateString()}</div>
          </div>
          
          <div class="flow-step successor">
            <div class="flow-step-label">⛓️ 衍生影响/后果 (Consequences)</div>
            <div class="flow-step-content" style="color:var(--neon-green)">${successor.title}</div>
            <div style="font-size:0.7rem; color:#8c9cb3;">${new Date(successor.event_time).toLocaleDateString()}</div>
          </div>
        `;
      } catch (err) {
        console.error('[Inspector] Error loading story chain details:', err);
        const loader = document.getElementById('temporal-flow-loader');
        loader.innerHTML = `
          <div style="color:#ff4757; font-size:0.75rem; background:rgba(255,71,87,0.1); border:1px solid rgba(255,71,87,0.2); padding:6px; border-radius:4px;">
            ⚠️ 请求后端数据出错，无法展开原子故事链：<br>
            <span style="font-family:monospace;">${err.message || err}</span>
          </div>
        `;
      }
    }

    // 更新左侧列表展示
    function updateNodeList(nodes) {
      const list = document.getElementById('node-list');
      document.getElementById('list-title').textContent = `关系节点 (${nodes.length})`;
      
      const visibleNodes = nodes.filter(n => {
        if (!graph.hasNode(String(n.id))) return false;
        return !graph.getNodeAttribute(String(n.id), 'hidden');
      });

      document.getElementById('list-meta').textContent = `激活展示: ${visibleNodes.length} / ${nodes.length}`;
      
      if (visibleNodes.length === 0) {
        list.innerHTML = '<div class="empty-note">此时间段内无活跃地缘事件</div>';
        return;
      }

      list.innerHTML = visibleNodes.map(n => {
        const geoKey = getGeoKey(n.title, n.description);
        const geo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];
        const primarySource = n.primary_source || (Array.isArray(n.sources) && n.sources.length ? n.sources[0] : 'unknown');
        const sourceCount = n.sources?.length || Object.keys(n.source_counts || {}).length || 0;
        const sourceLabel = primarySource === 'unknown' ? '未知来源' : DashboardShared.escapeHtml(primarySource);
        return `
          <div class="stack-item" onclick="focusNode('${n.id}')" style="border-left: 3px solid ${getSummaryColor(n.member_count, n.summary_kind === 'isolated')}">
            <div class="item-title" style="font-weight:600;">${n.title}</div>
            <div class="chip-row">
              <span class="chip info" style="font-size:0.65rem">${n.member_count} 成员</span>
              <span class="chip success" style="font-size:0.65rem; background:rgba(46, 213, 115, 0.08)">📰 ${sourceLabel}${sourceCount > 1 ? ` · ${sourceCount} 源` : ''}</span>
              <span class="chip" style="font-size:0.65rem; background:rgba(255,255,255,0.04)">📍 ${geo.name}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    // 聚焦定位与分流
    window.focusNode = (id) => {
      console.log('[focusNode] Focus requested for ID:', id, 'Current Level:', currentGraphLevel);
      if (currentGraphLevel === 'global') {
        enterDetailMode(id);
      } else {
        focusAtomicNode(id);
      }
    };

    // 聚焦微观原子事件节点
    window.focusAtomicNode = (id) => {
      console.log('[focusAtomicNode] Focusing atomic node ID:', id);
      if (graph.hasNode(id)) {
        const attr = graph.getNodeAttributes(id);
        renderer.getCamera().animate({ x: attr.x, y: attr.y, ratio: 0.15 }, { duration: 500 });
        focusedNodeId = id;
        updateNodesAndEdgesOpacity();
        showAtomicInspector(attr.data);
      }
    };

    // ================== L1-L6 下钻与原子图谱控制 ==================
    
    // 进入微观原子图模式
    window.enterDetailMode = async (summaryId) => {
      console.log('[enterDetailMode] Loading L2 Summary ID:', summaryId);
      
      const btnBack = document.getElementById('btn-back-to-global');
      const btnReset = document.getElementById('btn-reset-view');
      const btnFocus = document.getElementById('btn-focus-reset');
      
      if (btnBack) btnBack.style.display = 'inline-block';
      if (btnReset) btnReset.style.display = 'none';
      if (btnFocus) btnFocus.style.display = 'none';
      
      document.getElementById('list-meta').textContent = '读取原子图中...';
      focusedNodeId = null;
      
      try {
        const response = await api.getRelationshipSummaryGraph(summaryId);
        console.log('[enterDetailMode] Loaded L1 Atomic detail payload:', response);
        
        const { summary, nodes, edges } = response.data;
        if (!nodes || nodes.length === 0) {
          console.warn('[enterDetailMode] No atomic events returned for summary ID:', summaryId);
          document.getElementById('list-meta').textContent = '无原子事件数据';
          return;
        }
        
        currentGraphLevel = 'detail';
        currentSummaryId = summaryId;
        currentSummaryData = summary;
        detailNodes = nodes;
        detailEdges = edges;
        
        // 1. 下方时间轴视角无缝聚焦到该特定 Summary 的内部时间段内
        const timeStart = new Date(summary.time_start).getTime();
        const timeEnd = new Date(summary.time_end).getTime();
        
        console.log('[enterDetailMode] Narrowing timeline range to:', 
          new Date(timeStart).toLocaleDateString(), '-', new Date(timeEnd).toLocaleDateString()
        );
        
        document.getElementById('time-min-label').textContent = new Date(timeStart).toLocaleDateString();
        document.getElementById('time-max-label').textContent = new Date(timeEnd).toLocaleDateString();
        
        const slider = document.getElementById('slider-timeline');
        slider.min = timeStart;
        slider.max = timeEnd;
        slider.value = timeEnd;
        currentFilterTime = timeEnd;
        document.getElementById('val-time-display').textContent = new Date(timeEnd).toLocaleDateString();
        
        // 2. 渲染微观图形
        renderDetailGraph();
        
        // 3. 在右侧 Inspector 展示 Summary 概览及内部时序故事链
        showInspector({ data: summary });
        
      } catch (err) {
        console.error('[enterDetailMode] Error entering detail mode:', err);
        document.getElementById('list-meta').textContent = '加载原子图失败';
      }
    };
    
    // 退出微观原子图模式，返回全局视角
    window.exitDetailMode = () => {
      console.log('[exitDetailMode] Returning to macro global level');
      
      currentGraphLevel = 'global';
      currentSummaryId = null;
      currentSummaryData = null;
      detailNodes = [];
      detailEdges = [];
      
      const btnBack = document.getElementById('btn-back-to-global');
      const btnReset = document.getElementById('btn-reset-view');
      if (btnBack) btnBack.style.display = 'none';
      if (btnReset) btnReset.style.display = 'inline-block';
      
      // 重新载入全局图谱
      loadGlobalGraph();
    };
    
    // 核心微观原子图绘制
    window.renderDetailGraph = () => {
      graph.clear();
      
      if (detailNodes.length === 0) {
        document.getElementById('list-meta').textContent = '暂无原子数据';
        updateDetailNodeList([]);
        return;
      }
      
      const summary = currentSummaryData;
      const tMin = new Date(summary.time_start).getTime();
      const tMax = new Date(summary.time_end).getTime();
      const tRange = tMax - tMin || 1;
      
      // 1. 添加原子节点，并应用高美学排版坐标
      detailNodes.forEach((node, i) => {
        const isTimeHidden = currentFilterTime && (new Date(node.event_time).getTime() > currentFilterTime);
        
        // 计算排版坐标
        let finalX = 0;
        let finalY = 0;
        
        if (currentViewMode === 'topology') {
          // 平面拓扑排版：时间戳作为横轴线性映射，从左到右流淌，纵轴做 5 行错开
          const tNode = new Date(node.event_time).getTime();
          const ratio = (tNode - tMin) / tRange; // 0 到 1 之间
          
          finalX = (ratio - 0.5) * 500; // 横向分布于 -250 到 250 之间
          finalY = ((i % 5) - 2) * 55;   // 纵向分布，彻底解决节点重合问题
          
        } else {
          // 地缘沙盘模式：围绕地缘中心做极坐标多圈发散
          const geoKey = getGeoKey(node.title, node.description);
          const geo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];
          const geoXY = { x: geo.lng * 3.5, y: -geo.lat * 4.5 };
          
          const angle = (i / detailNodes.length) * Math.PI * 2;
          const radius = 10 + (i % 3) * 6; // 扩散半径
          
          finalX = geoXY.x + Math.cos(angle) * radius;
          finalY = geoXY.y + Math.sin(angle) * radius;
        }
        
        // 添加到 graphOLOGY
        graph.addNode(String(node.id), {
          label: node.title ? (node.title.substring(0, 15) + (node.title.length > 15 ? '...' : '')) : `Event ${node.id}`,
          x: finalX,
          y: finalY,
          size: 6,
          color: '#00d4ff', // 现代 neon cyan 赛博蓝
          nodeType: 'atomic',
          hidden: isTimeHidden,
          data: node
        });
      });
      
      // 2. 添加原子关系连线
      detailEdges.forEach(edge => {
        const sourceStr = String(edge.source);
        const targetStr = String(edge.target);
        
        if (graph.hasNode(sourceStr) && graph.hasNode(targetStr)) {
          // 安全防崩机制：若已存在该两个原子节点之间的连边（无论正向反向），则不再重复添加
          if (graph.hasEdge(sourceStr, targetStr) || graph.hasEdge(targetStr, sourceStr)) {
            console.log(`[renderDetailGraph] Skipping duplicate or reverse duplicate edge between ${sourceStr} and ${targetStr}`);
            return;
          }
          
          const isTemp = edge.type === 'temporal';
          let edgeLabel = edge.description ? edge.description.substring(0, 10) : '';
          
          if (isTemp) {
            edgeLabel = '时序推演';
          }
          
          graph.addEdge(sourceStr, targetStr, {
            size: isTemp ? 1.5 : Math.max(Math.min(Math.log(edge.weight + 1) * 1.5, 5), 1.5),
            color: isTemp ? 'rgba(165, 94, 234, 0.35)' : 'rgba(0, 212, 255, 0.3)', // 时序紫与物理蓝
            label: edgeLabel,
            edgeType: edge.type, 
            hidden: false,
            weight: edge.weight
          });
        }
      });
      
      const visibleCount = detailNodes.filter(n => {
        const isTimeHidden = new Date(n.event_time).getTime() > currentFilterTime;
        return !isTimeHidden;
      }).length;
      
      document.getElementById('list-meta').textContent = `展示 ${visibleCount}/${detailNodes.length} 原子节点`;
      
      // 3. 渲染左侧原子事件列表
      updateDetailNodeList(detailNodes);
      
      // 4. 重绘 Canvas 世界地图（若在 geo 模式）
      drawCyberWorldMap();
      
      // 5. 排版自适应就绪与镜头聚焦
      setTimeout(() => {
        if (renderer) {
          renderer.refresh();
          fitGraphToView(250);
        }
      }, 100);
      
      // 6. 动态调整透明度
      updateNodesAndEdgesOpacity();
    };
    
    // 更新左侧原子列表展示
    function updateDetailNodeList(nodes) {
      const list = document.getElementById('node-list');
      document.getElementById('list-title').textContent = `原子事件 (${nodes.length})`;
      
      const visibleNodes = nodes.filter(n => {
        if (!graph.hasNode(String(n.id))) return false;
        return !graph.getNodeAttribute(String(n.id), 'hidden');
      });
      
      document.getElementById('list-meta').textContent = `激活展示: ${visibleNodes.length} / ${nodes.length}`;
      
      if (visibleNodes.length === 0) {
        list.innerHTML = '<div class="empty-note">此时间段内无活跃原子事件</div>';
        return;
      }
      
      list.innerHTML = visibleNodes.map(n => {
        const geoKey = getGeoKey(n.title, n.description);
        const geo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];
        return `
          <div class="stack-item" onclick="focusNode('${n.id}')" style="border-left: 3px solid #00d4ff">
            <div class="item-title" style="font-weight:600;">${n.title}</div>
            <div class="chip-row">
              <span class="chip info" style="font-size:0.65rem">可信: ${(n.confidence * 100).toFixed(0)}%</span>
              <span class="chip" style="font-size:0.65rem; background:rgba(255,255,255,0.04)">⏱️ ${new Date(n.event_time).toLocaleDateString()}</span>
              <span class="chip warn" style="font-size:0.65rem; background:rgba(0, 212, 255, 0.05)">📍 ${geo.name}</span>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 右侧展示原子事件提取卡片详情
    window.showAtomicInspector = (data) => {
      const body = document.getElementById('inspector-body');
      console.log('[showAtomicInspector] Displaying details for atomic event:', data.id, 'Title:', data.title);
      
      const geoKey = getGeoKey(data.title, data.description);
      const geoInfo = GEO_COORDS[geoKey] || GEO_COORDS['GL'];
      
      body.innerHTML = `
        <div class="lineage-card" style="margin-bottom:1rem">
          <div class="eyebrow" style="color: var(--neon-cyan)">原子事实节点 (L1 Proto Event)</div>
          <h4 style="color:#fff; font-size:1.05rem; margin:0.4rem 0;">${data.title}</h4>
          <p style="color:#a5b5c9; font-size:0.85rem; line-height:1.5;">${data.description || '无详细描述'}</p>
          <div class="chip-row" style="margin-top:0.6rem">
            <span class="chip info" style="font-size:0.7rem">提取可信度: ${(data.confidence * 100).toFixed(0)}%</span>
            <span class="chip warn" style="font-size:0.7rem">📍 ${geoInfo.name}</span>
          </div>
          <div style="margin-top:0.8rem">
            <small style="color:#576b85; font-size:0.7rem">事件发生时间: ${new Date(data.event_time).toLocaleDateString()} ${new Date(data.event_time).toLocaleTimeString()}</small>
          </div>
        </div>
        
        <div class="lineage-card" style="margin-bottom:1.5rem">
          <div class="eyebrow" style="color: var(--neon-green)">📰 关联情报新闻源 (Evidence)</div>
          <div style="margin-top:0.6rem; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05); padding:0.8rem; border-radius:6px;">
            <div style="color:#fff; font-weight:600; font-size:0.85rem; line-height:1.4; margin-bottom:0.4rem;">
              ${data.news_title || '无关联新闻标题'}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.6rem;">
              <span style="font-size:0.7rem; color:#8c9cb3;">来源: ${data.news_source || '未知源'}</span>
              <a href="/proto-events.html" class="play-btn" style="text-decoration:none; padding:2px 8px; font-size:0.65rem;">进入解析台 🔍</a>
            </div>
          </div>
        </div>
      `;
    };

    document.addEventListener('DOMContentLoaded', initGraph);
  </script>
</body>
</html>
